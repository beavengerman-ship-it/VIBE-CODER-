<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Website Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white h-screen flex flex-col">
    <!-- Header Input Form -->
    <header class="p-4 border-b border-slate-800 flex gap-4 items-center bg-slate-900">
        <h1 class="font-bold text-xl text-indigo-400">AuraWeb AI</h1>
        <input id="promptInput" type="text" placeholder="Describe your aesthetic (e.g., minimal brutalist coffee shop)..." 
               class="flex-1 bg-slate-800 border border-slate-700 px-4 py-2 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
        <button onclick="generateSite()" class="bg-indigo-600 hover:bg-indigo-500 px-5 py-2 rounded-lg font-medium text-sm transition">
            Generate Site
        </button>
    </header>

    <!-- Preview Area -->
    <main class="flex-1 p-4 bg-slate-950">
        <iframe id="previewFrame" class="w-full h-full bg-white rounded-xl border border-slate-800"></iframe>
    </main>

    <script>
        async function generateSite() {
            const prompt = document.getElementById('promptInput').value;
            const iframe = document.getElementById('previewFrame');
            
            iframe.srcdoc = "<div style='display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;'>Generating your aesthetic...</div>";

            const res = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt })
            });
            
            const data = await res.json();
            iframe.srcdoc = data.html; // Injects the generated HTML directly into the sandbox iframe
        }
    </script>
</body>
</html>
